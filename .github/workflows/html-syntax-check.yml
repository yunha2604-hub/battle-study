name: HTML Syntax Check

on:
  push:
    paths:
      - '**.html'
      - '.htmlhintrc'
      - '.github/workflows/html-syntax-check.yml'
  pull_request:
    paths:
      - '**.html'
      - '.htmlhintrc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-html:
    name: Lint HTML Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run HTMLHint
        run: |
          npx htmlhint "public/**/*.html" --ignore "node_modules/**,.next/**,out/**"
